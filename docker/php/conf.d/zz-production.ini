; Lutapp production PHP settings (layered on php.ini-production).

expose_php = Off
memory_limit = 256M
max_execution_time = 60

; config/media.php allows uploads up to 50 MB (video); leave headroom.
upload_max_filesize = 55M
post_max_size = 60M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code is immutable inside the image; a new release is a new container.
opcache.validate_timestamps = 0
