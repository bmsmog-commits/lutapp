name: CI

# Continuous integration only — this workflow never deploys and uses no
# repository secrets, so it is safe to run on pull requests from forks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Belt and braces: the suite never needs a real API.Bible key (phpunit.xml
  # blanks it and every test fakes HTTP), and none is available here.
  API_BIBLE_API_KEY: ""

jobs:
  tests:
    name: Tests & frontend build (PHP 8.3, SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, bcmath, fileinfo, pdo_sqlite, sqlite3, zip, gd
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - name: Install Composer dependencies (from composer.lock)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies (from package-lock.json)
        run: npm ci

      # The Blade layout uses @vite, so the manifest must exist before the
      # feature tests render pages.
      - name: Build frontend assets
        run: npm run build

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # phpunit.xml configures an in-memory SQLite database, array cache and
      # sync queue; tests/TestCase.php blocks every un-faked HTTP request.
      - name: Run test suite
        run: php artisan test

  container:
    name: Production container build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Builds the image exactly as production would (never pushed), boots it
    # with a throwaway APP_KEY and no database, and requires /up to be healthy.
    steps:
      - uses: actions/checkout@v4

      - name: Build image (not pushed)
        run: docker build --tag lutapp:ci .

      - name: Image must not contain secrets, data or tests
        run: |
          docker run --rm --entrypoint sh lutapp:ci -c '
            cd /app
            found="$(find . -path ./vendor -prune -o -type f \( -name ".env" -o \( -name ".env.*" ! -name ".env.example" \) -o -name "*.sqlite" -o -name "*.sql" -o -name "*.dump" \) -print)"
            [ -z "$found" ] || { echo "Forbidden files in image: $found"; exit 1; }
            for p in tests phpunit.xml node_modules .git; do [ ! -e "$p" ] || { echo "Unexpected $p in image"; exit 1; }; done
            [ -f public/build/manifest.json ] || { echo "Vite manifest missing"; exit 1; }
            [ "$(id -un)" = "www-data" ] || { echo "Image does not run as www-data"; exit 1; }
            echo "image contents OK"'

      - name: Container refuses to start without APP_KEY
        run: |
          if docker run --rm lutapp:ci php artisan --version; then
            echo "Expected the entrypoint to refuse to start without APP_KEY"; exit 1
          fi

      - name: Boot and health-check
        run: |
          docker run -d --name lutapp-ci -p 8080:8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" lutapp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/up > /dev/null; then echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs lutapp-ci
          exit 1

  migrations-postgres:
    name: Migrations & seeders (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostgreSQL is the documented deployment target
    # (docs/lutapp-architecture.md, Dockerfile). This proves a fresh install,
    # seeder idempotency and full rollback on it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lutapp_ci
          POSTGRES_USER: lutapp
          POSTGRES_PASSWORD: lutapp-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lutapp -d lutapp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: lutapp_ci
      DB_USERNAME: lutapp
      DB_PASSWORD: lutapp-ci-only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, bcmath, fileinfo, pdo_pgsql, pgsql, zip
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - name: Install Composer dependencies (from composer.lock)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Fresh migrate
        run: php artisan migrate --force --no-interaction

      - name: Seed twice (must be idempotent)
        run: |
          php artisan db:seed --force --no-interaction
          php artisan db:seed --force --no-interaction

      - name: Assert seeded catalog has no duplicates
        run: |
          php artisan tinker --execute='
            $rows = App\Models\BibleTranslation::count();
            $codes = App\Models\BibleTranslation::distinct()->count("code");
            $verses = App\Models\BibleVerse::count();
            echo "translations=$rows distinct_codes=$codes verses=$verses\n";
            if ($rows === 0 || $rows !== $codes || $verses !== 31) { fwrite(STDERR, "Seeder idempotency check failed\n"); exit(1); }
          '

      - name: Roll back every migration
        run: php artisan migrate:reset --force --no-interaction

      - name: Migrate again after full rollback
        run: |
          php artisan migrate --force --no-interaction
          php artisan migrate:status
